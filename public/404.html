<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unique Spaces | Page Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --charcoal: #3d3935;
        --ochre: #b98f45;
        --paper: #f4f4f4;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--charcoal);
        color: var(--paper);
        font-family: Montserrat, Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .card {
        width: min(92vw, 720px);
        padding: 40px;
        border: 1px solid rgba(244, 244, 244, 0.12);
        background: linear-gradient(180deg, rgba(244, 244, 244, 0.04), rgba(244, 244, 244, 0.02));
        box-shadow: 0 24px 80px rgba(61, 57, 53, 0.25);
      }
      .eyebrow {
        margin: 0 0 16px;
        font-size: 11px;
        letter-spacing: 0.45em;
        text-transform: uppercase;
        color: rgba(244, 244, 244, 0.65);
      }
      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 9vw, 5rem);
        line-height: 0.95;
        font-weight: 300;
        text-transform: uppercase;
        color: var(--ochre);
      }
      p {
        max-width: 52ch;
        margin: 20px 0 0;
        line-height: 1.8;
        color: rgba(244, 244, 244, 0.78);
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 28px;
        padding: 14px 18px;
        border: 1px solid rgba(244, 244, 244, 0.16);
        color: var(--paper);
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.35em;
        font-size: 11px;
      }
      a:hover {
        border-color: var(--ochre);
        color: var(--ochre);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Unique Spaces</p>
      <h1>Page Not Found</h1>
      <p>
        The page you’re looking for doesn’t exist, or it may have moved. Use the link below to return to the
        homepage.
      </p>
      <a href="./">Back Home</a>
    </main>
  </body>
</html>
